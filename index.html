<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interiores Móveis Planejados</title>
<meta name="description" content="Mapa 3D de Maceió com os clientes da Interiores Móveis Planejados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Layout: cena 3D ocupando a tela, painel flutuante à esquerda (folha inferior no celular). */
  :root {
    --bg: #cfe3ee;
    --painel: rgba(255, 252, 247, .94);
    --texto: #1f2a33;
    --suave: #5d6b76;
    --borda: rgba(31, 42, 51, .12);
    --hover: rgba(31, 42, 51, .06);
    --madeira: #9a5b2e;
    --madeira-texto: #fff8f0;
    --ok: #2f7d4f;
    --erro: #b3261e;
    --rotulo: rgba(255, 255, 255, .92);
    --rotulo-texto: #2a3640;
    --fonte-titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --fonte: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a22; --painel: rgba(20, 29, 36, .93); --texto: #eef2f4; --suave: #9fb0bb;
      --borda: rgba(255, 255, 255, .1); --hover: rgba(255, 255, 255, .07);
      --madeira: #d08a52; --madeira-texto: #1d130b; --ok: #7fd19c; --erro: #ff8a80; --rotulo: rgba(20, 29, 36, .85); --rotulo-texto: #e6edf1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a22; --painel: rgba(20, 29, 36, .93); --texto: #eef2f4; --suave: #9fb0bb;
    --borda: rgba(255, 255, 255, .1); --hover: rgba(255, 255, 255, .07);
    --madeira: #d08a52; --madeira-texto: #1d130b; --ok: #7fd19c; --erro: #ff8a80; --rotulo: rgba(20, 29, 36, .85); --rotulo-texto: #e6edf1;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--texto); font-family: var(--fonte); font-size: 14px; }
  #cena { position: fixed; inset: 0; }

  #painel { position: fixed; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(12px, env(safe-area-inset-left, 0px)); width: 330px;
    max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; background: var(--painel); border: 1px solid var(--borda);
    border-radius: 16px; backdrop-filter: blur(10px); box-shadow: 0 12px 34px rgba(0, 0, 0, .18); }
  #painel header { display: flex; gap: 10px; align-items: flex-start; padding: 16px 16px 12px; border-bottom: 1px solid var(--borda); }
  #painel h1 { margin: 0; font: 700 19px/1.15 var(--fonte-titulo); text-wrap: balance; }
  #painel header p { margin: 4px 0 0; color: var(--suave); font-size: 13px; }
  #contador { color: var(--madeira); font-weight: 700; font-variant-numeric: tabular-nums; }
  #recolher { margin-left: auto; flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--borda);
    background: transparent; color: var(--texto); cursor: pointer; font-size: 14px; }

  .filtros { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--borda); }
  .filtro { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--borda); background: transparent; color: var(--texto); cursor: pointer; font: 500 12px var(--fonte); }
  .filtro i { width: 9px; height: 9px; border-radius: 50%; }
  .filtro[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }

  #lista { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 60px; }
  #lista li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  #lista li:hover, #lista li.ativo { background: var(--hover); }
  #lista li > i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #lista li > div { min-width: 0; }
  #lista b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lista small { color: var(--suave); }
  #lista .apagar { margin-left: auto; flex: none; background: none; border: 0; color: var(--suave); cursor: pointer; font-size: 18px; }

  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px 16px 16px; border-top: 1px solid var(--borda); }
  .acoes button, #form button { padding: 9px 8px; border-radius: 9px; border: 1px solid var(--borda); background: var(--hover);
    color: var(--texto); cursor: pointer; font: 600 12.5px var(--fonte); }
  .acoes button:hover { filter: brightness(1.05); border-color: var(--suave); }
  .acoes button.ligado, #form .salvar { background: var(--madeira); color: var(--madeira-texto); border-color: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--madeira); outline-offset: 2px; }

  #form { display: grid; gap: 9px; padding: 14px 16px 16px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  #form h3 { margin: 0; font: 700 16px var(--fonte-titulo); }
  #form .local { display: grid; gap: 7px; padding: 10px; border-radius: 10px; background: var(--hover); }
  #fLocal { font-size: 12.5px; color: var(--suave); }
  #fLocal.ok { color: var(--ok); font-weight: 600; }
  .erro { margin: 0; color: var(--erro); font-size: 12.5px; font-weight: 600; }
  .topo-acoes { padding: 12px 16px 0; }
  .primario { width: 100%; padding: 10px; border-radius: 10px; border: 0; background: var(--madeira); color: var(--madeira-texto);
    font: 600 14px var(--fonte); cursor: pointer; }
  .chave { display: flex; gap: 8px; align-items: center; padding: 9px 16px; font-size: 12.5px; color: var(--suave);
    border-bottom: 1px solid var(--borda); cursor: pointer; }
  #painel.cadastrando #lista, #painel.cadastrando .filtros, #painel.cadastrando .chave,
  #painel.cadastrando .acoes, #painel.cadastrando .topo-acoes { display: none; }
  #cartao .origem { margin-left: 6px; font-size: 11.5px; color: var(--suave); }
  #cartao .cartao-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  #cartao .cartao-acoes button { padding: 8px; border-radius: 9px; border: 1px solid var(--borda); background: var(--hover);
    color: var(--texto); cursor: pointer; font: 600 12.5px var(--fonte); }
  #cartao #cExcluir.confirmar { background: var(--erro); color: #fff; border-color: transparent; }
  #form label { display: grid; gap: 3px; font-size: 12px; color: var(--suave); }
  #form textarea { resize: vertical; }
  #form label, #form .linha > * { min-width: 0; }
  #form input, #form select, #form textarea { width: 100%; min-width: 0; }
  #form input, #form select, #form textarea { padding: 8px; border-radius: 8px; border: 1px solid var(--borda); background: transparent;
    color: var(--texto); font: 14px var(--fonte); }
  #form .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #copia { margin: 0 16px 12px; height: 90px; font: 11px ui-monospace, monospace; background: transparent; color: var(--texto);
    border: 1px solid var(--borda); border-radius: 8px; }

  #abertura { position: fixed; z-index: 3; left: 50%; top: calc(9% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    display: grid; justify-items: center; gap: 2px; padding: 14px 26px 16px; border-radius: 20px; text-align: center;
    background: var(--painel); border: 1px solid var(--borda); box-shadow: 0 14px 40px rgba(0, 0, 0, .2);
    backdrop-filter: blur(10px); pointer-events: none; transition: opacity .6s, transform .6s; }
  #abertura strong { font: 700 clamp(48px, 9vw, 84px)/1 var(--fonte-titulo); color: var(--madeira); font-variant-numeric: tabular-nums; }
  #abertura span { color: var(--suave); font-weight: 500; max-width: 26ch; text-wrap: balance; }
  #abertura.saindo { opacity: 0; transform: translateX(-50%) translateY(-14px); }
  #abertura .pulo { animation: pulo .3s ease-out; }
  @keyframes pulo { from { transform: scale(1.18); } to { transform: scale(1); } }
  #aviso { position: fixed; z-index: 3; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    padding: 8px 16px; background: var(--madeira); color: var(--madeira-texto); border-radius: 999px; font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }

  #cartao { position: fixed; z-index: 2; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: 320px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto;
    padding: 14px 16px; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18); backdrop-filter: blur(10px); }
  #cartao .fotos { display: grid; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--borda); }
  #cartao .fotos h3 { margin: 0; font: 700 14px var(--fonte-titulo); }
  #cartao .fotos h4 { margin: 4px 0 0; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
  #cGaleria { display: grid; gap: 6px; }
  #cartao .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  #cartao .miniatura { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 8px; padding: 0; cursor: zoom-in;
    background: var(--hover) center / cover no-repeat; }
  #cartao .dica { margin: 0; font-size: 12px; }
  #cartao .dica:empty { display: none; }
  #cartao .fotos-acoes { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  #cartao .fotos-acoes select { min-width: 0; padding: 7px; border-radius: 8px; border: 1px solid var(--borda); background: transparent;
    color: var(--texto); font: 13px var(--fonte); }
  #cAddFotos { padding: 8px 10px; border-radius: 9px; border: 0; background: var(--madeira); color: var(--madeira-texto);
    font: 600 12.5px var(--fonte); cursor: pointer; }
  #visor { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8, 10, 12, .94);
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  #visor img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  #vLegenda { position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center;
    color: #e9edf0; font-size: 14px; padding: 0 16px; }
  #visor .seta { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: rgba(255, 255, 255, .14); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; }
  #visor .esq { left: max(12px, env(safe-area-inset-left, 0px)); }
  #visor .dir { right: max(12px, env(safe-area-inset-right, 0px)); }
  #visor .visor-topo { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
  #visor .visor-topo button { height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: rgba(255, 255, 255, .14);
    color: #fff; font: 600 13px var(--fonte); cursor: pointer; }
  #vFechar { width: 38px; padding: 0 !important; font-size: 22px !important; }
  #vApagar.confirmar { background: #c62828 !important; }
  #cartao h2 { margin: 0 0 2px; font: 700 17px var(--fonte-titulo); }
  #cartao p { margin: 2px 0; color: var(--suave); }
  #cartao .etiqueta { display: inline-block; margin: 8px 0 10px; padding: 3px 9px; border-radius: 999px; color: #fff; font-size: 11.5px; font-weight: 600; }
  #cartao a { display: block; color: var(--madeira); font-weight: 600; text-decoration: none; }
  #cartao a:hover { text-decoration: underline; }
  #fecharCartao { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--suave); cursor: pointer; font-size: 18px; }
  .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }
  #ajuda { position: fixed; z-index: 1; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
    padding: 6px 10px; border-radius: 8px; background: var(--painel); color: var(--suave); font-size: 12px; }

  #painel.recolhido #lista, #painel.recolhido .filtros, #painel.recolhido .acoes, #painel.recolhido #form, #painel.recolhido .chave, #painel.recolhido #copia { display: none; }

  @media (max-width: 640px) {
    #painel { top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: max(8px, env(safe-area-inset-left, 0px));
      right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-height: 52%; }
    #cartao { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto;
      top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; max-height: 60%; }
    .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }
  #ajuda { display: none; }
  }
</style>
</head>
<body>
<div id="cena"></div>
<div id="abertura" aria-live="polite"><strong id="aNum">0</strong><span>clientes com móveis planejados em Maceió</span></div>
<div id="aviso" role="status" hidden></div>

<aside id="painel">
  <header>
    <div>
      <h1>Interiores Móveis Planejados</h1>
      <p><span id="contador">0</span> clientes em Maceió<span id="rotuloSim"> · inclui simulação</span></p>
    </div>
    <button id="recolher" aria-label="Recolher painel">▾</button>
  </header>
  <div class="topo-acoes"><button id="btnNovo" class="primario">＋ Cadastrar cliente</button></div>
  <div class="filtros" id="filtros"></div>
  <label class="chave"><input type="checkbox" id="chkSimulados"> Mostrar clientes simulados</label>
  <ul id="lista"></ul>
  <form id="form" hidden>
    <h3 id="fTitulo">Novo cliente</h3>
    <label>Nome do cliente<input id="fNome" required autocomplete="off" placeholder="Maria Souza"></label>
    <label>Endereço<input id="fEndereco" autocomplete="off" placeholder="Rua Jangadeiros Alagoanos, 1200"></label>
    <div class="linha">
      <label>Bairro<input id="fBairro" list="listaBairros" autocomplete="off" placeholder="Pajuçara"></label>
      <label>Ambiente<select id="fTipo"></select></label>
    </div>
    <div class="linha">
      <label>Instalação<input id="fData" type="month"></label>
      <label>Telefone<input id="fTelefone" type="tel" autocomplete="off" placeholder="(82) 9 0000-0000"></label>
    </div>
    <label>Observações<textarea id="fObs" rows="2" placeholder="Cozinha em L com ilha, MDF freijó"></textarea></label>
    <div class="local">
      <span id="fLocal">Localização ainda não definida</span>
      <div class="linha">
        <button type="button" id="fBuscar">Localizar endereço</button>
        <button type="button" id="fMarcar">Marcar no mapa</button>
      </div>
    </div>
    <p id="fErro" class="erro" hidden></p>
    <div class="linha">
      <button type="button" id="fCancelar">Cancelar</button>
      <button type="submit" class="salvar">Salvar cliente</button>
    </div>
  </form>
  <datalist id="listaBairros"></datalist>
  <input type="file" id="arquivo" accept=".csv,text/csv" hidden>
  <div class="acoes">
    <button id="btnTour">Tour pela cidade</button>
    <button id="btnVisao">Ver a cidade toda</button>
    <button id="btnSatelite">Satélite</button>
    <button id="btnAbertura">Rever abertura</button>
    <button id="btnExportar">Baixar planilha</button>
    <button id="btnImportar">Importar planilha</button>
  </div>
</aside>

<div id="cartao" hidden>
  <button id="fecharCartao" aria-label="Fechar">×</button>
  <h2 id="cNome"></h2>
  <p id="cBairro"></p>
  <p id="cDesc"></p>
  <p id="cObs"></p>
  <span class="etiqueta" id="cTipo"></span><span class="origem" id="cOrigem"></span>
  <a id="cGoogle" href="#" target="_blank" rel="noopener">Abrir no Google Maps ↗</a>
  <div class="cartao-acoes" id="cAcoes" hidden>
    <button id="cEditar">Editar</button>
    <button id="cExcluir">Excluir</button>
  </div>
  <section class="fotos">
    <h3 id="cFotosTitulo">Fotos dos ambientes</h3>
    <div id="cGaleria"></div>
    <p id="cFotosDica" class="dica"></p>
    <div class="fotos-acoes" id="cFotosAcoes">
      <select id="cAmbiente" aria-label="Ambiente das fotos"></select>
      <button id="cAddFotos">＋ Adicionar fotos</button>
    </div>
    <input type="file" id="arquivoFotos" accept="image/*" multiple hidden>
  </section>
</div>

<div id="visor" hidden role="dialog" aria-label="Foto do ambiente">
  <img id="vImagem" alt="">
  <p id="vLegenda"></p>
  <button id="vAnterior" class="seta esq" aria-label="Foto anterior">‹</button>
  <button id="vProxima" class="seta dir" aria-label="Próxima foto">›</button>
  <div class="visor-topo">
    <button id="vApagar">Apagar foto</button>
    <button id="vFechar" aria-label="Fechar">×</button>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="dados.js"></script>
<script>
const VISAO_CIDADE = { center: [-35.722, -9.638], zoom: 13.1, pitch: 60, bearing: -24 };
const VISAO_GERAL = { center: [-35.70, -9.58], zoom: 11.2, pitch: 35, bearing: -10 };
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Estado ----------
const CHAVE = 'interiores-clientes-reais', CHAVE_SIM = 'interiores-mostrar-simulados';
const ler = (k, padrao) => { try { const v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); } catch { return padrao; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
// clientes cadastrados neste aparelho (migra os pontos da versão anterior)
let reais = ler(CHAVE, null) ?? ler('mapa-maceio-pontos-extras', []);
reais.forEach((p, i) => { p.id ??= Date.now() + i; });
const salvarReais = () => gravar(CHAVE, reais);
let mostrarSimulados = ler(CHAVE_SIM, true);
const ativos = new Set(Object.keys(TIPOS));
// ordem: showroom e clientes fixos, cadastrados aqui, depois os simulados
const todos = () => [...PONTOS.filter(p => !p.simulado), ...reais.map(p => ({ ...p, local: true })),
  ...(mostrarSimulados ? PONTOS.filter(p => p.simulado) : [])];
const visiveis = () => todos().filter(p => ativos.has(p.tipo));
const clientes = () => visiveis().filter(p => p.tipo !== 'loja').length;
let pontos = [];          // pontos visíveis, com hora de nascimento na abertura
let abertura = null;
let selecionado = null;

// ---------- Mapa ----------
const mapa = new maplibregl.Map({
  container: 'cena',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  ...VISAO_GERAL, pitch: 0, bearing: 0,
  maxPitch: 78, antialias: true, attributionControl: { compact: true }
});
mapa.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
mapa.addControl(new maplibregl.FullscreenControl(), 'top-right');

// Coluna hexagonal (polígono) em volta do ponto, em metros.
function coluna([lng, lat], metros) {
  const dx = metros / (111320 * Math.cos(lat * Math.PI / 180)), dy = metros / 110540, anel = [];
  for (let i = 0; i <= 6; i++) { const a = i / 6 * Math.PI * 2 + 0.5; anel.push([lng + dx * Math.cos(a), lat + dy * Math.sin(a)]); }
  return [anel];
}
const easeOutBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

// Monta os GeoJSON do quadro atual (só pontos já nascidos, com o "pulo" da abertura).
function dadosQuadro(t) {
  const pinos = [], colunas = [];
  pontos.forEach((p, i) => {
    if (t < p.nasce) return;
    const k = Math.min(1, (t - p.nasce) / 520), pop = easeOutBack(k);
    const loja = p.tipo === 'loja';
    const props = { i, cor: TIPOS[p.tipo].cor, pop, onda: 1 - k, loja, sel: p === selecionado };
    pinos.push({ type: 'Feature', id: i, properties: props, geometry: { type: 'Point', coordinates: p.coord } });
    colunas.push({ type: 'Feature', id: i, properties: { ...props, altura: (loja ? 260 : 90 + (i % 7) * 12) * pop },
      geometry: { type: 'Polygon', coordinates: coluna(p.coord, loja ? 45 : 22) } });
  });
  return [{ type: 'FeatureCollection', features: pinos }, { type: 'FeatureCollection', features: colunas }];
}
function atualizarFontes(t) {
  if (!mapa.getSource('pinos')) return;

  mapa.getSource('colunas').setData(colunas);

// ---------- Clientes e fotos fixos do site (clientes.csv e fotos.json no repositório) ----------
let FOTOS_SITE = {};
async function carregarDoSite() {
  const [csv, fotos] = await Promise.all([
    fetch('clientes.csv', { cache: 'no-cache' }).then(r => (r.ok ? r.text() : '')).catch(() => ''),
    fetch('fotos.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : {})).catch(() => ({}))
  ]);
  FOTOS_SITE = fotos || {};
  const [cab, ...linhas] = lerCSV(csv.replace(/^\ufeff/, ''));
  if (!cab) return;
  const col = nome => cab.findIndex(c => normalizar(c).startsWith(nome));
  const i = { nome: col('nome'), end: col('ender'), bairro: col('bairro'), amb: col('ambiente'), inst: col('instal'),
    obs: col('obs'), lat: col('lat'), lng: col('lon') };
  linhas.forEach((l, n) => {
    const v = k => (i[k] < 0 ? '' : (l[i[k]] || '').trim());
    const lat = parseFloat(v('lat').replace(',', '.')), lng = parseFloat(v('lng').replace(',', '.'));
    const coord = isFinite(lat) && isFinite(lng) ? [lng, lat] : centroBairro(v('bairro'));
    if (!v('nome') || !coord) return;
    PONTOS.push({ id: 'site-' + n, fixo: true, nome: v('nome'), endereco: v('end'), bairro: v('bairro'), tipo: tipoDe(v('amb')),
      data: /^\d{4}-\d{2}$/.test(v('inst')) ? v('inst') : '', obs: v('obs'), coord });
  });
}

// ---------- Abertura: pinos pipocando e contador subindo ----------
const aNum = document.getElementById('aNum'), caixaAbertura = document.getElementById('abertura');
let relogio = 0, ultimoQuadro = null;
function iniciarAbertura() {
  fecharCartao();
  abertura = { n: 0 };
  aNum.textContent = 0;
  caixaAbertura.hidden = false;
  caixaAbertura.classList.remove('saindo');
  const ordem = pontos.map((p, i) => [p, p.tipo === 'loja' ? -1 : ((i * 2654435761) % 1000) / 1000]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const duracao = calmo ? 0 : Math.min(7000, Math.max(2400, ordem.length * 220));
  ordem.forEach((p, i) => { p.contado = false; p.nasce = relogio + 900 + (ordem.length > 1 ? duracao * Math.pow(i / (ordem.length - 1), 0.85) : 0); });
  if (!clientes()) { caixaAbertura.hidden = true; abertura = null; }
  mapa.jumpTo({ ...VISAO_GERAL, pitch: 0, bearing: 0 });
  mapa.easeTo({ ...VISAO_CIDADE, duration: calmo ? 0 : duracao + 2200, delay: 300, essential: true });
}
function contar(novos) {
  if (!abertura) return;
  abertura.n += novos;
  aNum.textContent = abertura.n;
  document.getElementById('contador').textContent = abertura.n;
  aNum.classList.remove('pulo'); void aNum.offsetWidth; aNum.classList.add('pulo');
  if (abertura.n >= clientes()) {
    abertura = null;
    setTimeout(() => caixaAbertura.classList.add('saindo'), 1400);
    setTimeout(() => { if (!abertura) caixaAbertura.hidden = true; }, 2000);
  }
}
document.getElementById('btnAbertura').onclick = iniciarAbertura;
mapa.getCanvas().addEventListener('pointerdown', () => { if (abertura) pontos.forEach(p => { if (!p.contado) p.nasce = relogio; }); });

let animando = true;
function quadro(tReal) {
  // relógio próprio: em aparelhos lentos a animação desacelera em vez de pular etapas
  relogio += Math.min(tReal - (ultimoQuadro ?? tReal), 100);
  ultimoQuadro = tReal;
  let novos = 0, emAndamento = false;
  pontos.forEach(p => {
    if (relogio >= p.nasce && !p.contado) { p.contado = true; if (p.tipo !== 'loja') novos++; }
    if (relogio < p.nasce + 600) emAndamento = true;
  });
  if (novos) contar(novos);
  if (emAndamento || animando) atualizarFontes(relogio);
  animando = emAndamento;
  requestAnimationFrame(quadro);
}

// ---------- Painel ----------
function renderizar() {
  const antigos = new Map(pontos.map(p => [p.coord.join() + p.nome, p]));
  pontos = visiveis().map(p => ({ ...p, nasce: antigos.get(p.coord.join() + p.nome)?.nasce ?? 0, contado: true }));
  if (abertura) { abertura = null; caixaAbertura.hidden = true; pontos.forEach(p => p.nasce = 0); }
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  const frag = document.createDocumentFragment();
  pontos.forEach(p => {
    const li = document.createElement('li');
    li.tabIndex = 0;
    li.innerHTML = `<i style="background:${TIPOS[p.tipo].cor}"></i><div><b></b><small></small></div>`;
    li.querySelector('b').textContent = p.nome;
    li.querySelector('small').textContent = `${p.bairro || 'Maceió'} · ${TIPOS[p.tipo].nome}${p.local ? ' · cadastrado' : ''}`;
    li.onclick = () => selecionar(p);
    li.onkeydown = e => { if (e.key === 'Enter') selecionar(p); };

  });
  lista.appendChild(frag);

}

// Busca de endereço no OpenStreetMap (Nominatim), limitada a Maceió.
async function geocodificar(endereco, bairro) {
  const q = [endereco, bairro, 'Maceió', 'Alagoas', 'Brasil'].filter(Boolean).join(', ');
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br'
    + '&viewbox=-35.82,-9.36,-35.55,-9.72&bounded=1&q=' + encodeURIComponent(q);
  const r = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
  if (!r.ok) throw new Error('busca indisponível');
  const [achou] = await r.json();
  return achou ? [+achou.lon, +achou.lat] : null;
}

function lerCSV(texto) {
  const sep = (texto.split('\n')[0].match(/;/g) || []).length >= (texto.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const linhas = [];
  let linha = [], campo = '', aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      linha.push(campo); campo = '';
      if (linha.some(v => v.trim())) linhas.push(linha);
      linha = [];
    } else campo += c;
  }
  linha.push(campo);
  if (linha.some(v => v.trim())) linhas.push(linha);
  return linhas;
}
function tipoDe(texto) {
  const t = normalizar(texto);
  if (t.startsWith('dorm') || t.includes('quarto') || t.includes('closet')) return 'dormitorio';
  if (t.startsWith('sala') || t.includes('home')) return 'sala';
  if (t.startsWith('escr') || t.includes('consult')) return 'escritorio';
  if (t.startsWith('banh') || t.includes('lavabo')) return 'banheiro';
  return 'cozinha';
}
$('btnImportar').onclick = () => $('arquivo').click();
$('arquivo').onchange = async e => {
  const arquivo = e.target.files[0];
  e.target.value = '';
  if (!arquivo) return;
  const [cab, ...linhas] = lerCSV((await arquivo.text()).replace(/^﻿/, ''));
  if (!cab || !linhas.length) return avisar('A planilha está vazia');
  const idx = {};
  cab.forEach((c, i) => {
    const n = normalizar(c);
    const chave = n.startsWith('nome') || n === 'cliente' ? 'nome' : n.startsWith('ender') || n === 'rua' ? 'endereco'
      : n.startsWith('bairro') ? 'bairro' : n.startsWith('ambiente') || n.startsWith('tipo') ? 'ambiente'
      : n.startsWith('instal') || n.startsWith('data') ? 'instalacao' : n.startsWith('tel') || n.startsWith('fone') ? 'telefone'
      : n.startsWith('obs') || n.startsWith('descr') ? 'observacoes' : n.startsWith('lat') ? 'latitude'
      : n.startsWith('lon') || n === 'lng' ? 'longitude' : null;
    if (chave && !(chave in idx)) idx[chave] = i;
  });
  if (!('nome' in idx)) return avisar('A planilha precisa de uma coluna "nome"', 5000);
  let novos = 0, semLocal = 0;
  for (let n = 0; n < linhas.length; n++) {
    const v = k => (idx[k] === undefined ? '' : (linhas[n][idx[k]] || '').trim());
    if (!v('nome')) continue;
    avisar(`Importando ${n + 1} de ${linhas.length}…`, 0);
    let coord = null;
    const lat = parseFloat(v('latitude').replace(',', '.')), lng = parseFloat(v('longitude').replace(',', '.'));
    if (isFinite(lat) && isFinite(lng)) coord = [lng, lat];
    else if (v('endereco')) {
      try { coord = await geocodificar(v('endereco'), v('bairro')); } catch {}
      await new Promise(r => setTimeout(r, 1100));   // a busca pede no máximo 1 consulta por segundo
    }
    coord ??= centroBairro(v('bairro'));
    if (!coord) { semLocal++; continue; }
    const inst = v('instalacao');
    let m = inst.match(/^(\d{4})-(\d{1,2})/), data = '';
    if (m) data = `${m[1]}-${m[2].padStart(2, '0')}`;
    else if ((m = inst.match(/^(\d{1,2})\/(\d{4})$/))) data = `${m[2]}-${m[1].padStart(2, '0')}`;
    else if ((m = inst.match(/^(\d{4})$/))) data = `${m[1]}-01`;
    reais.push({ id: Date.now() + n, nome: v('nome'), endereco: v('endereco'), bairro: v('bairro'), tipo: tipoDe(v('ambiente')),
      data,
      telefone: v('telefone'), obs: v('observacoes'), coord: coord.map(x => +(+x).toFixed(5)) });
    novos++;
  }
  salvarReais();
  renderizar();
  avisar(`${novos} cliente(s) importado(s)${semLocal ? `; ${semLocal} sem localização encontrada` : ''}`, 6000);
};

// ---------- Fotos dos ambientes ----------
// Guardadas no IndexedDB do navegador (cabe bem mais que o localStorage), já reduzidas.
const AMBIENTES = ['Cozinha', 'Dormitório', 'Sala', 'Escritório', 'Banheiro', 'Área gourmet', 'Closet', 'Lavanderia', 'Varanda', 'Outro'];
let bancoFotos = null;
function abrirBanco() {
  return bancoFotos ??= new Promise((ok, falha) => {
    const r = indexedDB.open('interiores-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath: 'id' }).createIndex('cliente', 'cliente');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => falha(r.error);
  });
}
async function noBanco(modo, acao) {
  const db = await abrirBanco();
  return new Promise((ok, falha) => {
    const tx = db.transaction('fotos', modo), req = acao(tx.objectStore('fotos'));
    tx.oncomplete = () => ok(req?.result);
    tx.onerror = () => falha(tx.error);
  });
}
const fotosDoCliente = id => noBanco('readonly', s => s.index('cliente').getAll(id));
const guardarFoto = foto => noBanco('readwrite', s => s.put(foto));
const apagarFoto = id => noBanco('readwrite', s => s.delete(id));
async function apagarFotosDoCliente(id) { for (const f of await fotosDoCliente(id)) await apagarFoto(f.id); }

// Reduz para no máximo 1600 px no lado maior, em JPEG.
async function reduzir(arquivo, max = 1600) {
  const img = await createImageBitmap(arquivo, { imageOrientation: 'from-image' }).catch(() => null)
    ?? await new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = URL.createObjectURL(arquivo); });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k);
  c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.84));
}

let urlsFotos = [], fotosAbertas = [];
const chaveFotos = p => (p.local ? 'local-' + p.id : 'fixo-' + normalizar(p.nome));
async function mostrarFotos(p) {
  const galeria = $('cGaleria'), alvo = p;
  urlsFotos.forEach(u => URL.revokeObjectURL(u));
  urlsFotos = [];
  galeria.innerHTML = '';
  $('cFotosAcoes').hidden = p.simulado;
  $('cFotosDica').textContent = p.simulado ? 'Cliente simulado: cadastre um cliente real para adicionar fotos.' : '';
  $('cAmbiente').value = AMBIENTES.includes(TIPOS[p.tipo].nome) ? TIPOS[p.tipo].nome : 'Outro';
  // fotos fixas do site (dados.js) + fotos adicionadas neste aparelho
  let lista = [...(p.fotos || []), ...(FOTOS_SITE[normalizar(p.nome)] || [])].map((f, i) => ({ id: 'site' + i, ambiente: f.ambiente || TIPOS[p.tipo].nome, src: encodeURI(f.src), fixa: true }));
  try { lista = lista.concat((await fotosDoCliente(chaveFotos(p))).sort((a, b) => a.criado - b.criado)); } catch {}
  if (selecionado !== alvo) return;
  lista.forEach(f => { if (f.blob) { f.src = URL.createObjectURL(f.blob); urlsFotos.push(f.src); } });
  // agrupa por ambiente, na ordem em que aparecem
  const grupos = new Map();
  lista.forEach(f => { if (!grupos.has(f.ambiente)) grupos.set(f.ambiente, []); grupos.get(f.ambiente).push(f); });
  fotosAbertas = [...grupos.values()].flat();
  $('cFotosTitulo').textContent = fotosAbertas.length ? `Fotos dos ambientes (${fotosAbertas.length})` : 'Fotos dos ambientes';
  if (!fotosAbertas.length && !p.simulado) $('cFotosDica').textContent = 'Nenhuma foto ainda.';
  grupos.forEach((fotos, ambiente) => {
    const h = document.createElement('h4');
    h.textContent = ambiente;
    const grade = document.createElement('div');
    grade.className = 'grade';
    fotos.forEach(f => {
      const b = document.createElement('button');
      b.className = 'miniatura';
      b.setAttribute('aria-label', `Ver foto: ${ambiente}`);
      b.style.backgroundImage = `url("${f.src}")`;
      b.onclick = () => abrirFoto(fotosAbertas.indexOf(f));
      grade.appendChild(b);
    });
    galeria.append(h, grade);
  });
}

AMBIENTES.forEach(a => $('cAmbiente').add(new Option(a)));
$('cAddFotos').onclick = () => $('arquivoFotos').click();
$('arquivoFotos').onchange = async e => {
  const arquivos = [...e.target.files], p = selecionado;
  e.target.value = '';
  if (!arquivos.length || !p) return;
  const ambiente = $('cAmbiente').value;
  let feitas = 0;
  for (const arquivo of arquivos) {
    avisar(`Salvando foto ${feitas + 1} de ${arquivos.length}…`, 0);
    try {
      const blob = await reduzir(arquivo);
      await guardarFoto({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, cliente: chaveFotos(p), ambiente, blob, criado: Date.now() });
      feitas++;
    } catch {}
  }
  avisar(feitas === arquivos.length ? `${feitas} foto(s) adicionada(s) em ${ambiente}`
    : `${feitas} de ${arquivos.length} foto(s) salvas. Algumas não puderam ser lidas ou falta espaço no aparelho.`, 5000);
  if (selecionado === p) mostrarFotos(p);
};

// Visualizador em tela cheia
let fotoAtual = 0;
function abrirFoto(i) {
  fotoAtual = (i + fotosAbertas.length) % fotosAbertas.length;
  const f = fotosAbertas[fotoAtual];
  $('vImagem').src = f.src;
  $('vImagem').alt = `Foto do ambiente ${f.ambiente}`;
  $('vLegenda').textContent = `${selecionado?.nome || ''} · ${f.ambiente} · ${fotoAtual + 1} de ${fotosAbertas.length}`;
  $('vApagar').hidden = !!f.fixa;
  $('vApagar').classList.remove('confirmar');
  $('vApagar').textContent = 'Apagar foto';
  $('vAnterior').hidden = $('vProxima').hidden = fotosAbertas.length < 2;
  $('visor').hidden = false;
}
const fecharVisor = () => { $('visor').hidden = true; $('vImagem').removeAttribute('src'); };
$('vFechar').onclick = fecharVisor;
$('vAnterior').onclick = () => abrirFoto(fotoAtual - 1);
$('vProxima').onclick = () => abrirFoto(fotoAtual + 1);
$('visor').addEventListener('click', e => { if (e.target.id === 'visor') fecharVisor(); });
addEventListener('keydown', e => {
  if ($('visor').hidden) return;
  if (e.key === 'Escape') fecharVisor();
  if (e.key === 'ArrowLeft') abrirFoto(fotoAtual - 1);
  if (e.key === 'ArrowRight') abrirFoto(fotoAtual + 1);
});
let toqueX = null;
$('visor').addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
$('visor').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - (toqueX ?? 0);
  if (Math.abs(dx) > 50 && fotosAbertas.length > 1) abrirFoto(fotoAtual + (dx < 0 ? 1 : -1));
  toqueX = null;
});
$('vApagar').onclick = async e => {
  const b = e.currentTarget;
  if (!b.classList.contains('confirmar')) { b.classList.add('confirmar'); b.textContent = 'Confirmar'; return; }
  await apagarFoto(fotosAbertas[fotoAtual].id);
  fecharVisor();
  avisar('Foto apagada');
  if (selecionado) mostrarFotos(selecionado);
};

document.getElementById('recolher').onclick = e => {
  const p = document.getElementById('painel');
  p.classList.toggle('recolhido');
  e.currentTarget.textContent = p.classList.contains('recolhido') ? '▴' : '▾';
};

montarFiltros();
renderizar();
if (innerWidth <= 640) { document.getElementById('painel').classList.add('recolhido'); document.getElementById('recolher').textContent = '▴'; }
