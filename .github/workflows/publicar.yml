name: Atualizar e publicar o mapa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar ImageMagick
        run: command -v mogrify || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Reduzir fotos, montar fotos.json e localizar endereços
        run: node scripts/atualizar.mjs
      - name: Salvar o que foi gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fotos fotos.json clientes.csv
          git diff --cached --quiet || (git commit -m "Atualiza fotos e clientes (automático)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
